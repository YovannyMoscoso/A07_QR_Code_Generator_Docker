name: QR Code Generator CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test QR Code Generator
        run: |
          python main.py --url https://www.njit.edu
          test -n "$(find qr_codes -name '*.png' -print -quit)"

      - name: Build Docker image
        run: |
          docker build -t qr-code-generator-app .

      - name: Run Docker container
        run: |
          mkdir -p docker_output
          chmod 777 docker_output
          docker run --rm \
            -v "${{ github.workspace }}/docker_output:/app/qr_codes" \
            qr-code-generator-app \
            --url https://www.njit.edu

      - name: Verify Docker-generated QR code
        run: |
          ls -la docker_output
          test -n "$(find docker_output -name '*.png' -print -quit)"